services:
  ccbb-backend:
    build:
      context: ./Backend
    env_file: .env
    ports:
      - 8000:8000
    depends_on:
      - ccbb-backup
    restart: always
    volumes:
      - db-data:/app/data
      - static-data:/app/staticfiles
    labels:
      - docker-volume-backup.stop-during-backup=true

  ccbb-webserver:
    build:
      context: ./WebServer
    env_file: .env
    depends_on:
      - ccbb-backend
    ports:
      - 80:80
      - 443:443
    restart: always
    volumes:
      - static-data:/app/staticfiles

  ccbb-backup:
    image: offen/docker-volume-backup:v2.40.0
    restart: always
    env_file: ./Backup/backup.env
    volumes:
      - db-data:/backup/db-backup:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./Backup/archive:/archive

volumes:
  db-data:
  static-data:
