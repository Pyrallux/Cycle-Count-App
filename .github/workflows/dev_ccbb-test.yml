# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - CCBB-test

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 'Create env file'
        run: |
          touch .env
          echo DJANGO_KEY='${{ secrets.DJANGO_KEY }}' >> .env
          echo SSL_PRIVATE='${{ secrets.SSL_PRIVATE }}' >> .env
          echo SSL_PUBLIC='${{ secrets.SSL_PUBLIC }}' >> .env
          cat .env
      - name: Zip artifact for deployment
        run: zip release.zip ./* -r
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: ccbb-app
          path: |
            release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: ccbb-app
      - name: Unzip artifact for deployment
        run: unzip release.zip
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_00E1C2FFE9DA4B658E27AB64F9B8DCF9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5F9518CDAA804323B53CC20F57C467E0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FA29813C6A4E414F8ACA2E4BA764ADCF }}
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'CCBB-test'
          slot-name: 'Production'
          startup-command: 'docker compose up -d'
